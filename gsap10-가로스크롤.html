<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap10</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      a {
        color: #fff;
        text-decoration: none;
      }
      body {
        color: #fff;
        font-family: "NexonLv1Gothic";
        font-weight: 300;
        background-color: #333;
      }
      #title {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 1000;
      }
      #title h1 {
        font-size: 30px;

        font-weight: 400;
      }
      #title p {
        font-size: 16px;
      }
      #title ul {
        margin-top: 10px;
      }
      #title li {
        display: inline;
      }
      #title li a {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px dashed #fff;
        display: inline-block;
        text-align: center;
        line-height: 20px;
        font-size: 12px;
      }
      #title li.active a {
        background: #fff;
        color: #000;
      }

      /* cont */
      .item {
        width: 100%;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item_num {
        font-size: 5vw;
        position: absolute;
        right: 20px;
        bottom: 20px;
        font-family: "Lato";
        font-weight: 100;
        z-index: 100;
      }
      .item_imgWrap {
        width: 30%;
        padding-bottom: 18%;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
      }
      .item_img {
        position: absolute;
        left: -5%;
        top: -5%;
        width: 110%;
        height: 110%;
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        filter: saturate(0%);
        transition: all 1s;
      }
      .item_img:hover {
        filter: saturate(100%);
        transform: scale(1.025);
      }
      #section1 .item_img {
        background-image: url(img/img12.jpg);
      }
      #section2 .item_img {
        background-image: url(img/img13.jpg);
      }
      #section3 .item_img {
        background-image: url(img/img07.jpg);
      }
      #section4 .item_img {
        background-image: url(img/img02.jpg);
      }
      #section5 .item_img {
        background-image: url(img/img16.jpg);
      }
      #section6 .item_img {
        background-image: url(img/img06.jpg);
      }
      #section7 .item_img {
        background-image: url(img/img18.jpg);
      }
      #section8 .item_img {
        background-image: url(img/img19.jpg);
      }
      #section9 .item_img {
        background-image: url(img/img20.jpg);
      }
      #section1,
      #section3,
      #section5,
      #section7,
      #section9 {
        background-color: #111;
      }

      /* 가로레이아웃 */
      #cont {
        overflow: hidden;
      }
      #horizontal {
        display: flex;
        flex-wrap: nowrap;
        width: 500%;
      }
      #horizontal > section {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header id="title">
      <h1>gsap10</h1>
    </header>
    <!-- //title  -->

    <main id="cont">
      <section id="section1" class="item">
        <span class="item_num">01</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section1 -->

      <section id="section2" class="item">
        <span class="item_num">02</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section2 -->

      <!-- horizontal -->
      <div id="horizontal">
        <section id="section3" class="item">
          <span class="item_num">03</span>
          <figure class="item_imgWrap img3">
            <div class="item_img"></div>
          </figure>
        </section>
        <!-- //section3 -->

        <section id="section4" class="item">
          <span class="item_num">04</span>
          <figure class="item_imgWrap img4">
            <div class="item_img"></div>
          </figure>
        </section>
        <!-- //section4 -->

        <section id="section5" class="item">
          <span class="item_num">05</span>
          <figure class="item_imgWrap img5">
            <div class="item_img"></div>
          </figure>
        </section>
        <!-- //section5 -->

        <section id="section6" class="item">
          <span class="item_num">06</span>
          <figure class="item_imgWrap img6">
            <div class="item_img"></div>
          </figure>
        </section>
        <!-- //section6 -->

        <section id="section7" class="item">
          <span class="item_num">07</span>
          <figure class="item_imgWrap img7">
            <div class="item_img"></div>
          </figure>
        </section>
        <!-- //section7 -->
      </div>
      <!-- //horizontal -->

      <section id="section8" class="item">
        <span class="item_num">08</span>
        <figure class="item_imgWrap img8">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section8 -->

      <section id="section9" class="item">
        <span class="item_num">09</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section9 -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollToPlugin.min.js"></script>

    <script>
      const horizontal = document.querySelector("#horizontal");
      const section = gsap.utils.toArray("#horizontal > section");

      let scrollTween = gsap.to(section, {
        xPercent: -100 * (section.length - 1),
        ease: "none",

        scrollTrigger: {
          trigger: horizontal,
          start: "top top",
          end: "+=" + (horizontal.offsetWidth - window.innerWidth), // horizontal의 전체 너비 - 화면너비

          pin: true,
          scrub: 1,
          markers: true,
          invalidateOnRefresh: true,
          anticipatePin: 1,

          // snap: {
          //   snapTo: 1 / (section.length - 1), // 스크롤을 멈추면 가장 가까운 섹션 위치로 이동
          //   inertia: false, // 스냅의 관성효과 무시
          //   duration: { min: 0.1, max: 0.1 }, // 스냅 이동 시간을 0.1초로 고정

          //   invalidateOnRefresh: true, // 새로고침이나 화면 크기 변경시 설정값을 다시 계산
          //   anticipatePin: 1, // 화면이 튀는 현상 완화
          // },
        },
      });

      gsap.to(".img3", {
        scale: 3,
        duration: 2,
        ease: "back.out(1.7)",
        scrollTrigger: {
          trigger: ".img3",
          containerAnimation: scrollTween, // scrollTween - 가로로 이동시키는 애니메이션
          //containerAnimation: scrollTween -가로 이동 애니메이션을 기준으로 트리거 위치 계산
          start: "left center", // 이미지의 왼쪽이 화면 가로 중앙에 도착하는 시점
          toggleActions: "play none reverse none",
          markers: true,
          id: "img3", // 마커의 이름 표시
        },
      });

      gsap.to(".img4", {
        scale: 2,
        rotation: 360,
        duration: 2,
        ease: "back.out(1.7)",
        scrollTrigger: {
          trigger: ".img4",
          containerAnimation: scrollTween, // scrollTween - 가로로 이동시키는 애니메이션
          //containerAnimation: scrollTween -가로 이동 애니메이션을 기준으로 트리거 위치 계산
          start: "left center", // 이미지의 왼쪽이 화면 가로 중앙에 도착하는 시점
          toggleActions: "play none reverse none",
          markers: true,
          id: "img4",
        },
      });

      gsap.to(".img5", {
        scale: 0.3,
        duration: 2,
        ease: "back.out(1.7)",
        scrollTrigger: {
          trigger: ".img5",
          containerAnimation: scrollTween,
          start: "left center", // 이미지의 왼쪽이 화면 가로 중앙에 도착하는 시점
          toggleActions: "play none reverse none",
          markers: true,
          id: "img5",
        },
      });
      gsap.to(".img6", {
        rotation: -360,
        duration: 2,
        ease: "back.out(1.7)",
        scrollTrigger: {
          trigger: ".img6",
          containerAnimation: scrollTween,
          start: "left center", // 이미지의 왼쪽이 화면 가로 중앙에 도착하는 시점
          toggleActions: "play none reverse none",
          markers: true,
          id: "img6",
        },
      });
      gsap.to(".img7", {
        rotation: 720,
        duration: 2,
        ease: "back.out(1.7)",
        scrollTrigger: {
          trigger: ".img7",
          containerAnimation: scrollTween,
          start: "left center", // 이미지의 왼쪽이 화면 가로 중앙에 도착하는 시점
          toggleActions: "play none reverse none",
          markers: true,
          id: "img7",
        },
      });
    </script>
  </body>
</html>
