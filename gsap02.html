<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap02</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      a {
        color: #fff;
        text-decoration: none;
      }
      body {
        color: #fff;
        font-family: "NexonLv1Gothic";
        font-weight: 300;
        background-color: #b38686;
      }
      #title {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 1000;
      }
      #title h1 {
        font-size: 30px;

        margin-bottom: 10px;
        padding-bottom: 5px;
        font-weight: 400;
        display: inline-block;
      }

      /* cont */
      #cont {
        overflow: hidden;
      }
      .item {
        width: 100%;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #section2,
      #section4,
      #section6,
      #section8 {
        background-color: #916a6a;
      }
      .item_num {
        position: absolute;
        right: 20px;
        bottom: 20px;
        font-size: 5vw;
        line-height: 1;
      }
      .item_img {
        width: 10vw;
        height: 10vw;
        margin: 1vw;
        background-color: #fff;
        background-size: cover;
        background-position: center;
      }
      #section1 .item_img {
        background-image: url(img/img20.jpg);
      }
      #section2 .item_img {
        background-image: url(img/img19.jpg);
      }
      #section3 .item_img {
        background-image: url(img/img16.jpg);
      }
      #section4 .item_img {
        background-image: url(img/img17.jpg);
      }
      #section5 .item_img {
        background-image: url(img/img15.jpg);
      }
      #section6 .item_img {
        background-image: url(img/img14.jpg);
      }
      #section7 .item_img {
        background-image: url(img/img13.jpg);
      }
      #section8 .item_img {
        background-image: url(img/img12.jpg);
      }
      #section9 .item_img {
        background-image: url(img/img11.jpg);
      }

      /* option */
      #section3 .item_img {
        width: 100px;
        height: 100px;
        border-radius: 50px;
      }
      #section5 {
        flex-direction: column;
      }
      #section5 .item_text,
      #section6 .item_text {
        font-size: 5vw;
        text-transform: uppercase;
        font-weight: bold;
      }
      #section7 .item_text {
        font-size: 5vw;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background-color: #b38686;
        padding: 30px;
        width: 100%;
        text-align: center;
      }
      #section8 {
        flex-direction: column;
      }
      #section8 .item_text {
        font-size: 2vw;
        line-height: 1.5;
        text-transform: uppercase;
      }
      #section8 .item_img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
      }
      #section9 .item_img {
        width: 200px;
        height: 200px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <header id="title">
      <h1>GSAP02</h1>
    </header>
    <!-- //title  -->

    <main id="cont">
      <section id="section1" class="item">
        <span class="item_num">01</span>
        <div class="item_img"></div>
      </section>
      <!-- //section1 -->

      <section id="section2" class="item">
        <span class="item_num">02</span>
        <div class="item_img i1"></div>
        <div class="item_img i2"></div>
        <div class="item_img i3"></div>
      </section>
      <!-- //section2 -->

      <section id="section3" class="item">
        <span class="item_num">03</span>
        <div class="item_img"></div>
        <div class="item_img"></div>
        <div class="item_img"></div>
        <div class="item_img"></div>
        <div class="item_img"></div>
        <div class="item_img"></div>
      </section>
      <!-- //section3 -->

      <section id="section4" class="item">
        <span class="item_num">04</span>
        <div class="item_img"></div>
      </section>
      <!-- //section4 -->

      <section id="section5" class="item">
        <span class="item_num">05</span>
        <div class="item_text t1">GSAP-GSAP</div>
        <div class="item_text t2">GSAP-GSAP</div>
        <div class="item_text t3">GSAP-GSAP</div>
        <div class="item_text t4">GSAP-GSAP</div>
      </section>
      <!-- //section5 -->

      <section id="section6" class="item">
        <span class="item_num">06</span>
        <div class="item_text">BTS</div>
      </section>
      <!-- //section6 -->

      <section id="section7" class="item">
        <span class="item_num">07</span>
        <div class="item_text t1">Swim,</div>
        <div class="item_text t2">swim</div>
        <div class="item_text t3">Water falling off your skin</div>
        <div class="item_text t4">Swim,</div>
        <div class="item_text t5">swim</div>
        <div class="item_text t6">I could spend a lifetime</div>
        <div class="item_text t7">watching you</div>
      </section>
      <!-- //section7 -->

      <section id="section8" class="item">
        <span class="item_num">08</span>
        <div class="item_text t1">GSAP-GSAP-GSAP</div>
        <div class="item_text t2">GSAP-GSAP-GSAP</div>
        <div class="item_text t3">GSAP-GSAP-GSAP</div>
        <div class="item_img i1"></div>
      </section>
      <!-- //section8 -->

      <section id="section9" class="item">
        <span class="item_num">09</span>
        <div class="item_img"></div>
      </section>
      <!-- //section9 -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>

    <script>
      //01.애니메이션 주기
      const ani1 = gsap.timeline();
      ani1
        .to("#section1 .item_img", {
          rotation: 720,
          scale: 0,
          borderRadius: 200,
        })
        .to("#section1 .item_img", {
          rotation: 0,
          scale: 1,
          borderRadius: 20,
        });

      ScrollTrigger.create({
        animation: ani1,
        trigger: "#section1",
        start: "top top",
        end: "+=2000px", // 시작점에서 2000px 더 스크롤하면 종료
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: false,
      });

      //02.순차적 애니메이션
      const ani2 = gsap.timeline();
      ani2
        .from("#section2 .i1", {
          y: -100,
          autoAlpha: 0,
          borderRadius: 200,
        })
        .from("#section2 .i2", {
          y: 100,
          autoAlpha: 0,
          borderRadius: 200,
        })
        .from("#section2 .i3", {
          y: -100,
          autoAlpha: 0,
          borderRadius: 200,
        });

      ScrollTrigger.create({
        animation: ani2,
        trigger: "#section2",
        start: "top top",
        end: "+=2000px",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: false,
      });

      //03.랜덤 애니메이션
      const ani3 = gsap.timeline();
      ani3.from("#section3 .item_img", {
        autoAlpha: 0,
        y: -100,
        ease: "bounce.out",
        //stagger: 0.2, //0.2초 간격으로 순차적 애니메이션
        // stagger: {
        //   from: "center",
        //   each: 0.2,
        // },
        stagger: {
          amount: 3,
          from: "random",
        },
      });

      ScrollTrigger.create({
        animation: ani3,
        trigger: "#section3",
        start: "top top",
        end: "+=3000",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: false,
      });

      //04.이미지 축소하기
      const ani4 = gsap.timeline();
      ani4.from("#section4 .item_img", {
        autoAlpha: 0,
        scale: 5,
        width: "100vw",
        height: "100vw",
      });

      ScrollTrigger.create({
        animation: ani4,
        trigger: "#section4",
        start: "top top",
        end: "+=3000",
        scrub: 0.7,
        pin: true,
        anticipatePin: 1,
        markers: false,
      });

      //05.텍스트 애니메이션
      const ani5 = gsap.timeline();
      ani5
        .to(
          "#section5 .t1",
          {
            xPercent: 300,
          },
          "text", // 이름을 동일하게 만들면 동시에 움직임, 이름이 없으면 순차적으로 움직임
        )
        .to(
          "#section5 .t2",
          {
            xPercent: -300,
          },
          "text",
        )
        .to(
          "#section5 .t3",
          {
            xPercent: 300,
          },
          "text",
        )
        .to(
          "#section5 .t4",
          {
            xPercent: -300,
          },
          "text",
        );

      ScrollTrigger.create({
        animation: ani5,
        trigger: "#section5",
        start: "top top",
        end: "+=3000",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: false,
      });

      //06. 텍스트 확대하기
      const ani6 = gsap.timeline();
      ani6
        .to("#section6 .item_text", {
          scale: 60,
        })
        .to("#section6 .item_text", {
          autoAlpha: 0,
          duration: 2,
        });

      ScrollTrigger.create({
        animation: ani6,
        trigger: "#section6",
        start: "top top",
        end: "+=3000",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: true,
      });

      //07. 텍스트 제자리 애니메이션
      const ani7 = gsap.timeline();
      ani7
        .from("#section7 .t1", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t2", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t3", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t4", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t5", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t6", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t7", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1")
        .from("#section7 .t8", { duration: 1, autoAlpha: 0, y: 50, ease: "power4.in" }, "+=1");

      ScrollTrigger.create({
        animation: ani7,
        trigger: "#section7",
        start: "top top",
        end: "+=3000",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: false,
      });

      // "+=1"  이전 애니메이션 종료 후 1초 대기
      // "-=1"  이전 애니메이션 종료 1초 전에 시작
      // "<"    이전 애니메이션과 동시에 시작
      // "<0.5" 이전 애니메이션 시작 0.5초 후 시작
      // 생략    이전 애니메이션이 끝나면 바로 시작

      //08. 텍스트 애니메이션
      const ani8 = gsap.timeline();
      ani8
        .from("#section8 .t1", { x: innerWidth * 1 })
        .from("#section8 .t2", { x: innerWidth * -1 })
        .from("#section8 .t3", { x: innerWidth * 1 })
        .from("#section8 .i1", { x: innerWidth * 1, rotation: 360, scale: 5.5 });

      ScrollTrigger.create({
        animation: ani8,
        trigger: "#section8",
        start: "top top",
        end: "+=3000",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: true,
      });

      //09. 이미지 알아서 애니메이션, 복습
      const ani9 = gsap.timeline();
      ani9
        .to("#section9 .item_img", {
          scale: 13,
        })
        .to("#section9 .item_img", {
          rotation: 360,
        })
        .to("#section9 .item_img", {
          autoAlpha: 0,
        });

      ScrollTrigger.create({
        animation: ani9,
        trigger: "#section9",
        start: "top top",
        end: "+=3000",
        scrub: true,
        pin: true,
        anticipatePin: 1,
        markers: true,
      });
    </script>
  </body>
</html>
