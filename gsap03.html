<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap03</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      a {
        color: #fff;
        text-decoration: none;
      }
      body {
        color: #fff;
        font-family: "NexonLv1Gothic";
        font-weight: 300;
        background-color: #111;
      }
      #title {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 1000;
      }
      #title h1 {
        font-size: 30px;
      }

      /* cont */
      #cont {
        overflow: hidden;
      }
      .item {
        width: 100%;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      #section2,
      #section4,
      #section6,
      #section8 {
        background-color: #222;
      }
      .item_num {
        position: absolute;
        right: 20px;
        bottom: 20px;
        font-size: 3vw;
        line-height: 1;
        z-index: 10;
      }
      .item_img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100vh;
        background-color: #fff;
        background-size: cover;
        background-position: center;
      }
      .item_img::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.2);
        z-index: 1;
      }
      #section1 .item_img {
        background-image: url(img/img12.jpg);
      }
      #section2 .item_img {
        background-image: url(img/img13.jpg);
      }
      #section3 .item_img {
        background-image: url(img/img07.jpg);
      }
      #section4 .item_img {
        background-image: url(img/img02.jpg);
      }
      #section5 .item_img {
        background-image: url(img/img16.jpg);
      }
      #section6 .item_img {
        background-image: url(img/img06.jpg);
      }
      #section7 .item_img {
        background-image: url(img/img18.jpg);
      }
      #section8 .item_img {
        background-image: url(img/img19.jpg);
      }
      #section9 .item_img {
        background-image: url(img/img20.jpg);
      }
      .item_title {
        font-size: 5vw;
        z-index: 100;
        text-transform: uppercase;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <header id="title">
      <h1>GSAP03</h1>
    </header>
    <!-- //title  -->

    <main id="cont">
      <section id="section1" class="item">
        <span class="item_num">01</span>
        <div class="item_img"></div>
        <h2 class="item_title">section1</h2>
      </section>
      <!-- //section1 -->

      <section id="section2" class="item">
        <span class="item_num">02</span>
        <div class="item_img"></div>
        <h2 class="item_title">section2</h2>
      </section>
      <!-- //section2 -->

      <section id="section3" class="item">
        <span class="item_num">03</span>
        <div class="item_img"></div>
        <h2 class="item_title">section3</h2>
      </section>
      <!-- //section3 -->

      <section id="section4" class="item">
        <span class="item_num">04</span>
        <div class="item_img"></div>
        <h2 class="item_title">section4</h2>
      </section>
      <!-- //section4 -->

      <section id="section5" class="item">
        <span class="item_num">05</span>
        <div class="item_img"></div>
        <h2 class="item_title">section5</h2>
      </section>
      <!-- //section5 -->

      <section id="section6" class="item">
        <span class="item_num">06</span>
        <div class="item_img"></div>
        <h2 class="item_title">section6</h2>
      </section>
      <!-- //section6 -->

      <section id="section7" class="item">
        <span class="item_num">07</span>
        <div class="item_img"></div>
        <h2 class="item_title">section7</h2>
      </section>
      <!-- //section7 -->

      <section id="section8" class="item">
        <span class="item_num">08</span>
        <div class="item_img"></div>
        <h2 class="item_title">section8</h2>
      </section>
      <!-- //section8 -->

      <section id="section9" class="item">
        <span class="item_num">09</span>
        <div class="item_img"></div>
        <h2 class="item_title">section9</h2>
      </section>
      <!-- //section9 -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollToPlugin.min.js"></script>

    <script>
      // 01 한개 섹션 고정
      // const panel = document.querySelector("#section1");

      // ScrollTrigger.create({
      //   trigger: panel,
      //   start: "top top",
      //   pin: true,
      //   pinSpacing: false, // 꼭 넣어주기!! (요소 아래에 추가 공간을 만들지 않겠다)
      // });

      // 02 여러개 섹션 고정
      // const items = document.querySelectorAll(".item");
      const pannels = gsap.utils.toArray(".item");

      pannels.forEach((pannel, idx) => {
        ScrollTrigger.create({
          trigger: pannel,
          start: "top top",
          pin: true,
          pinSpacing: false,
        });
      });
    </script>
  </body>
</html>
