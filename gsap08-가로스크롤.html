<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap08</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      a {
        color: #fff;
        text-decoration: none;
      }
      body {
        color: #fff;
        font-family: "NexonLv1Gothic";
        font-weight: 300;
        background-color: #333;
      }
      #title {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 1000;
      }
      #title h1 {
        font-size: 30px;

        font-weight: 400;
      }
      #title p {
        font-size: 16px;
      }
      #title ul {
        margin-top: 10px;
      }
      #title li {
        display: inline;
      }
      #title li a {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px dashed #fff;
        display: inline-block;
        text-align: center;
        line-height: 20px;
        font-size: 12px;
      }
      #title li.active a {
        background: #fff;
        color: #000;
      }

      /* cont */
      .item {
        width: 100%;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item_num {
        font-size: 5vw;
        position: absolute;
        right: 20px;
        bottom: 20px;
        font-family: "Lato";
        font-weight: 100;
        z-index: 100;
      }
      .item_imgWrap {
        width: 30%;
        padding-bottom: 18%;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
      }
      .item_img {
        position: absolute;
        left: -5%;
        top: -5%;
        width: 110%;
        height: 110%;
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        filter: saturate(0%);
        transition: all 1s;
      }
      .item_img:hover {
        filter: saturate(100%);
        transform: scale(1.025);
      }
      #section1 .item_img {
        background-image: url(img/img12.jpg);
      }
      #section2 .item_img {
        background-image: url(img/img13.jpg);
      }
      #section3 .item_img {
        background-image: url(img/img07.jpg);
      }
      #section4 .item_img {
        background-image: url(img/img02.jpg);
      }
      #section5 .item_img {
        background-image: url(img/img16.jpg);
      }
      #section6 .item_img {
        background-image: url(img/img06.jpg);
      }
      #section7 .item_img {
        background-image: url(img/img18.jpg);
      }
      #section8 .item_img {
        background-image: url(img/img19.jpg);
      }
      #section9 .item_img {
        background-image: url(img/img20.jpg);
      }
      #section1,
      #section3,
      #section5,
      #section7,
      #section9 {
        background-color: #111;
      }

      /* 가로레이아웃 */
      #cont {
        overscroll-behavior: none;
        width: 900%;
        height: 100vh;
        display: flex;
        flex-wrap: nowrap;
      }
    </style>
  </head>
  <body>
    <header id="title">
      <h1>gsap08</h1>
    </header>
    <!-- //title  -->

    <main id="cont">
      <section id="section1" class="item">
        <span class="item_num">01</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section1 -->

      <section id="section2" class="item">
        <span class="item_num">02</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section2 -->

      <section id="section3" class="item">
        <span class="item_num">03</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section3 -->

      <section id="section4" class="item">
        <span class="item_num">04</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section4 -->

      <section id="section5" class="item">
        <span class="item_num">05</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section5 -->

      <section id="section6" class="item">
        <span class="item_num">06</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section6 -->

      <section id="section7" class="item">
        <span class="item_num">07</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section7 -->

      <section id="section8" class="item">
        <span class="item_num">08</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section8 -->

      <section id="section9" class="item">
        <span class="item_num">09</span>
        <figure class="item_imgWrap">
          <div class="item_img"></div>
        </figure>
      </section>
      <!-- //section9 -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollToPlugin.min.js"></script>

    <script>
      let sections = gsap.utils.toArray(".item");
      console.log(sections.offsetWidth);

      gsap.to(sections, {
        xPercent: -100 * (sections.length - 1),
        ease: "none",

        scrollTrigger: {
          trigger: "#cont",
          pin: true,
          scrub: 1,
          snap: 1 / (sections.length - 1),
          end: "+=7000",
          // end: "+=" + (sections.offsetWidth - window.innerWidth),
          markers: true,
        },
      });
    </script>
  </body>
</html>
